name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm ci

      - name: Check environment
        run: |
          node --version
          npm --version
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" && echo "OIDC URL: OK" || echo "OIDC URL: MISSING"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" && echo "OIDC TOKEN: OK" || echo "OIDC TOKEN: MISSING"

      - run: npm publish --access public
